services:
  - type: web
    name: socioburp-creative-ai
    env: python
    plan: free
    # alembic upgrade head runs on every deploy, after deps install and
    # before the new code goes live. Without this, a schema change ships
    # in the ORM model but never reaches the live database until someone
    # runs the migration by hand -- exactly what happened with migration
    # 0010 (businesses.pending_first_request): the column existed in code,
    # not in Postgres, and every request touching Business broke with
    # psycopg2.errors.UndefinedColumn until it was applied manually.
    # init_db() (app/db.py, run at startup) can't cover this gap -- it
    # only creates missing TABLES, it never alters existing ones.
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_OAUTH_REDIRECT_URI
        sync: false
